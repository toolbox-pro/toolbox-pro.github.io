<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Básico -->
    <title>Generador de Colores y Paletas HEX, RGB, HSL | ToolBox Pro</title>
    <meta name="description" content="Genera paletas de colores armónicas y convierte valores entre HEX, RGB y HSL gratis y al instante en tu navegador.">
    <meta name="keywords" content="generador de colores, convertidor hex a rgb, paleta de colores css, selector de color online, hex rgb hsl">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://toolbox-pro.github.io/generador-color/">
    <meta name="theme-color" content="#0b0f19">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://toolbox-pro.github.io/generador-color/">
    <meta property="og:title" content="Generador de Colores y Paletas - ToolBox Pro">
    <meta property="og:description" content="Convierte códigos HEX, RGB, HSL y crea paletas cromáticas para tus proyectos web de forma gratuita.">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #080c14;
            --bg-card: #111827;
            --bg-input: #1f293d;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --radius-lg: 20px;
            --radius-md: 12px;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
        }

        header { 
            background: rgba(17, 24, 39, 0.8); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            padding: 20px; 
            text-align: center;
        }
        .nav-back { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-bottom: 10px; }
        .nav-back:hover { text-decoration: underline; }
        h1 { font-size: 1.8rem; font-weight: 800; color: #fff; }

        main.container { max-width: 900px; margin: 0 auto; padding: 30px 20px; flex: 1; width: 100%; }

        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin-bottom: 30px;
        }

        .color-preview-box {
            width: 100%;
            height: 140px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .picker-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            cursor: pointer;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: var(--radius-md); }

        .btn-action {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .formats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .format-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 15px;
        }
        .format-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .format-value {
            font-family: var(--font-mono);
            font-size: 1.05rem;
            color: var(--accent);
            margin: 8px 0;
            word-break: break-all;
        }

        .btn-copy-small {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-copy-small:hover { background: #2d3748; }

        /* Paleta Aleatoria */
        .palette-section { margin-top: 35px; border-top: 1px solid var(--border-color); padding-top: 25px; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
        .palette-swatch {
            height: 90px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .palette-swatch:hover { transform: scale(1.04); }
        .palette-hex { font-family: var(--font-mono); font-size: 0.75rem; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; color: #fff; }

        /* Toast */
        #toastContainer { position: fixed; bottom: 25px; right: 25px; z-index: 9999; }
        .toast { background: var(--bg-card); border: 1px solid var(--primary); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        footer { text-align: center; padding: 30px 20px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: auto; }
        footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 600px) {
            .palette-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
            .palette-swatch { height: 75px; padding: 4px; }
            .palette-hex { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

<header>
    <a href="../" class="nav-back">&larr; Volver a ToolBox Pro</a>
    <h1>🎨 Generador de Colores y Paletas</h1>
</header>

<main class="container">

    <div class="tool-card">
        <div id="colorPreview" class="color-preview-box"></div>

        <div class="picker-row">
            <label for="colorPicker" style="font-weight:600;">Seleccionar color:</label>
            <input type="color" id="colorPicker" value="#6366f1">
            <button class="btn-action" onclick="generateRandomColor()">🎲 Color Aleatorio</button>
        </div>

        <div class="formats-grid">
            <div class="format-card">
                <span class="format-label">Código HEX</span>
                <div class="format-value" id="hexVal">#6366f1</div>
                <button class="btn-copy-small" onclick="copyText('hexVal')">Copiar HEX</button>
            </div>
            <div class="format-card">
                <span class="format-label">Código RGB</span>
                <div class="format-value" id="rgbVal">rgb(99, 102, 241)</div>
                <button class="btn-copy-small" onclick="copyText('rgbVal')">Copiar RGB</button>
            </div>
            <div class="format-card">
                <span class="format-label">Código HSL</span>
                <div class="format-value" id="hslVal">hsl(239, 84%, 67%)</div>
                <button class="btn-copy-small" onclick="copyText('hslVal')">Copiar HSL</button>
            </div>
        </div>

        <!-- Paleta Armónica -->
        <div class="palette-section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:1.1rem; color:#fff;">Paleta Armónica Generada</h3>
                <button class="btn-action" style="padding: 8px 14px; font-size:0.85rem;" onclick="generatePalette()">🔄 Nueva Paleta</button>
            </div>
            <div class="palette-grid" id="paletteContainer"></div>
        </div>
    </div>

</main>

<div id="toastContainer"></div>

<footer>
    <p>&copy; 2026 ToolBox Pro - Herramienta de Conversión Cromática Gratuita | <a href="../">Inicio</a></p>
</footer>

<script>
    const colorPicker = document.getElementById('colorPicker');
    const colorPreview = document.getElementById('colorPreview');
    const hexVal = document.getElementById('hexVal');
    const rgbVal = document.getElementById('rgbVal');
    const hslVal = document.getElementById('hslVal');
    const paletteContainer = document.getElementById('paletteContainer');

    function hexToRgb(hex) {
        let c = hex.replace('#', '');
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0;
        } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return {
            h: Math.round(h * 360),
            s: Math.round(s * 100),
            l: Math.round(l * 100)
        };
    }

    function updateColorValues(hex) {
        colorPreview.style.backgroundColor = hex;
        hexVal.innerText = hex.toUpperCase();

        const { r, g, b } = hexToRgb(hex);
        rgbVal.innerText = `rgb(${r}, ${g}, ${b})`;

        const { h, s, l } = rgbToHsl(r, g, b);
        hslVal.innerText = `hsl(${h}, ${s}%, ${l}%)`;
    }

    colorPicker.addEventListener('input', (e) => {
        updateColorValues(e.target.value);
    });

    function generateRandomColor() {
        const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        colorPicker.value = randomHex;
        updateColorValues(randomHex);
        generatePalette();
    }

    function generatePalette() {
        paletteContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const swatch = document.createElement('div');
            swatch.className = 'palette-swatch';
            swatch.style.backgroundColor = hex;
            swatch.onclick = () => {
                colorPicker.value = hex;
                updateColorValues(hex);
                showToast(`Color ${hex.toUpperCase()} seleccionado`);
            };

            const label = document.createElement('span');
            label.className = 'palette-hex';
            label.innerText = hex.toUpperCase();

            swatch.appendChild(label);
            paletteContainer.appendChild(swatch);
        }
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            showToast(`¡Copiado: ${text}!`);
        });
    }

    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    // Inicializar
    updateColorValues(colorPicker.value);
    generatePalette();
</script>

</body>
</html>
