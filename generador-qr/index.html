<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Específico para el Generador QR -->
    <title>Generador de Códigos QR Gratis sin Vencimiento | ToolBox Pro</title>
    <meta name="description" content="Crea códigos QR personalizados para URL, textos o WiFi gratis. Descarga en alta calidad PNG sin registro y sin fecha de caducidad.">
    <meta name="keywords" content="generador de codigos qr gratis, crear qr online, qr para enlaces, generador qr permanente">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://toolbox-pro.github.io/generador-qr/">
    <meta name="theme-color" content="#0b0f19">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-body: #080c14;
            --bg-card: #111827;
            --bg-input: #1f293d;
            --primary: #6366f1;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
        }
        
        header { 
            background: rgba(17, 24, 39, 0.8); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            padding: 30px 20px; 
            text-align: center;
        }
        h1.logo { font-size: 2rem; font-weight: 800; color: #fff; }
        h1.logo span { background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; }

        main.container { max-width: 900px; margin: 0 auto; padding: 30px 20px; flex: 1; width: 100%; }

        .nav-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .tab-btn { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            padding: 10px 18px; 
            border-radius: var(--radius-md); 
            font-weight: 600; 
            text-decoration: none;
            font-size: 0.9rem; 
        }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .tool-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 35px; box-shadow: var(--shadow); }
        .tool-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .tool-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input[type="text"] { width: 100%; padding: 13px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: #fff; }

        .btn { 
            background: var(--primary); color: #fff; border: none; padding: 14px 28px; border-radius: var(--radius-md); 
            font-weight: 700; font-size: 0.98rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 100%; text-decoration: none;
        }
        .btn-success { background: var(--accent); }

        .preview-box { margin-top: 25px; padding: 22px; background: var(--bg-body); border-radius: var(--radius-md); border: 1px solid var(--border-color); text-align: center; }
        #qrOutput canvas, #qrOutput img { margin: 0 auto; border-radius: 8px; padding: 12px; background: #fff; }

        footer { background: #080c14; border-top: 1px solid var(--border-color); padding: 25px 20px; text-align: center; font-size: 0.88rem; color: var(--text-muted); margin-top: 40px; }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<header>
    <a href="../" class="logo" style="text-decoration:none;"><h1>🛠️ ToolBox<span>Pro</span></h1></a>
    <p>Generador de Códigos QR Personalizados y Gratuitos</p>
</header>

<main class="container">

    <nav class="nav-tabs">
        <a href="../" class="tab-btn">🏠 Inicio</a>
        <a href="../compresor-webp/" class="tab-btn">🖼️ Compresor WebP</a>
        <a href="./" class="tab-btn active">📱 Creador QR</a>
    </nav>

    <section class="tool-panel">
        <h2 class="tool-title">Generador de Códigos QR</h2>
        <p class="tool-desc">Crea códigos QR permanentes para tus enlaces o redes sociales sin vencimiento ni límites.</p>

        <div class="form-group">
            <label for="qrText">Enlace URL o Texto para codificar</label>
            <input type="text" id="qrText" placeholder="https://tusitio.com o escribe tu texto...">
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div class="form-group">
                <label for="qrColorDark">Color del Código</label>
                <input type="color" id="qrColorDark" value="#000000" style="height: 48px; width: 100%; padding: 4px; cursor: pointer;">
            </div>
            <div class="form-group">
                <label for="qrColorLight">Color de Fondo</label>
                <input type="color" id="qrColorLight" value="#ffffff" style="height: 48px; width: 100%; padding: 4px; cursor: pointer;">
            </div>
        </div>

        <button class="btn" onclick="generateQR()">✨ Generar Código QR</button>

        <div id="qrResult" class="preview-box" style="display: none;">
            <div id="qrOutput"></div>
            <button class="btn btn-success" onclick="downloadQR()" style="margin-top: 20px;">⬇️ Descargar Código QR (PNG HD)</button>
        </div>
    </section>

</main>

<footer>
    <p>&copy; 2026 ToolBox Pro. Herramientas Web Gratuitas.</p>
</footer>

<script>
    let qrcodeObj = null;
    function generateQR() {
        const text = document.getElementById('qrText').value.trim();
        const colorDark = document.getElementById('qrColorDark').value;
        const colorLight = document.getElementById('qrColorLight').value;

        if (!text) {
            alert("Ingresa un enlace o texto para codificar.");
            return;
        }

        const outputDiv = document.getElementById('qrOutput');
        outputDiv.innerHTML = "";
        qrcodeObj = new QRCode(outputDiv, {
            text: text,
            width: 220,
            height: 220,
            colorDark : colorDark,
            colorLight : colorLight,
            correctLevel : QRCode.CorrectLevel.H
        });

        document.getElementById('qrResult').style.display = 'block';
    }

    function downloadQR() {
        setTimeout(() => {
            const img = document.querySelector('#qrOutput img');
            const canvas = document.querySelector('#qrOutput canvas');
            let imageSrc = img && img.src ? img.src : (canvas ? canvas.toDataURL("image/png") : null);
            
            if(imageSrc) {
                const a = document.createElement("a");
                a.href = imageSrc;
                a.download = "codigo_qr_toolbox.png";
                a.click();
            } else {
                alert("Error al descargar el archivo.");
            }
        }, 100);
    }
</script>

</body>
</html>
